[tool.ruff]
line-length = 120
target-version = "py314"
include = ["*.py"]
exclude = ["__pycache__", ".venv", "node_modules", "investimentos/*/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "SIM", "RUF"]

# Exceções conscientes (ver specs/aplicacao.md e AGENTS.md):
# - settings: herança por `from .base import *` é a convenção do Django (base/dev/prod).
# - models/serializers: listas de campos e choices são atributos de classe mutáveis por design.
# - scripts de ingestão: `django.setup()` precisa rodar antes dos imports de models (E402).
[tool.ruff.lint.per-file-ignores]
"investimentos_project/settings/*.py" = ["F403", "F405"]
"investimentos/**/models.py" = ["RUF012"]
"investimentos/**/serializers.py" = ["RUF012"]
"tests.py" = ["RUF012"]
".agents/scripts/*.py" = ["E402"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["investimentos/**/*.py"]
exclude = ["**/migrations/*"]
